# Compila o APK (Kotlin). Funciona de dois jeitos, sem precisar configurar nada:
#  1) se existir "kitsune-kotlin.zip" na raiz do repositório, extrai e compila o zip;
#  2) senão, compila os arquivos do próprio repositório (settings.gradle.kts na raiz).
# Roda a cada push na branch principal e também à mão (Actions > Run workflow).
name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZIP: kitsune-kotlin.zip
      # secrets não podem ser lidos direto em `if:`; esta variável diz se a chave de assinatura existe
      HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o projeto
        run: |
          if [ -f "$ZIP" ]; then
            echo "Usando o zip: $ZIP"
            rm -rf projeto && mkdir projeto
            unzip -q "$ZIP" -d projeto
            # se o zip tiver uma única pasta na raiz, entra nela
            if [ "$(find projeto -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find projeto -mindepth 1 -maxdepth 1)" ]; then
              echo "PROJ=$(find projeto -mindepth 1 -maxdepth 1)" >> "$GITHUB_ENV"
            else
              echo "PROJ=projeto" >> "$GITHUB_ENV"
            fi
          elif [ -f settings.gradle.kts ]; then
            echo "Usando os arquivos do repositório"
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            echo "::error::Não achei $ZIP nem settings.gradle.kts na raiz do repositório."
            exit 1
          fi

      - name: Conferir os arquivos principais
        run: |
          cd "$PROJ"
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            test -f "$f" || { echo "::error::Faltando: $f"; exit 1; }
          done
          echo "--- settings.gradle.kts ---"; cat settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar (release com R8)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd "$PROJ"
          gradle --no-daemon --stacktrace assembleRelease

      - name: Assinar com a sua chave (só se os secrets existirem)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_PASS --key-pass env:KEY_PASS \
            --out kitsune-color-nativo.apk "$PROJ/app/build/outputs/apk/release/app-release.apk"
          "${BT}apksigner" verify kitsune-color-nativo.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Separar o APK final
        run: |
          if [ ! -f kitsune-color-nativo.apk ]; then
            cp "$PROJ/app/build/outputs/apk/release/app-release.apk" kitsune-color-nativo.apk
          fi
          echo "### APK compilado" >> "$GITHUB_STEP_SUMMARY"
          echo "Tamanho: **$(du -h kitsune-color-nativo.apk | cut -f1)**" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-color-nativo
          path: kitsune-color-nativo.apk
