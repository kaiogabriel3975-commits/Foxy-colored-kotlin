name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extrair o projeto do zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Nenhum arquivo .zip encontrado na raiz do repositório"
            exit 1
          fi
          echo "Usando $ZIP"
          mkdir -p _proj
          unzip -q -o "$ZIP" -d _proj
          echo "Arquivos extraídos:"
          find _proj -type f | head -50
          SET=$(find _proj \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SET" ]; then
            echo "::error::settings.gradle não encontrado dentro do zip"
            exit 1
          fi
          DIR=$(dirname "$SET")
          echo "Projeto em $DIR"
          echo "PROJ_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          cd "$PROJ_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: _proj/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
